name: Gold Shark Scout CI

on:
  push:
    paths:
      - 'gold-shark-scout/**'
  pull_request:
    paths:
      - 'gold-shark-scout/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold-shark-scout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
